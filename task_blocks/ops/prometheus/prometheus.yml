# Scrape config. Only the app exposes application metrics; Prometheus scrapes
# itself so the monitoring stack's own health is visible too.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: task-blocks

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: task-blocks-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000
        labels:
          service: task-blocks

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
